# Publishes the Reader to GitHub Pages on every push. The archive comes from the "archive-data" release and is
# split into chunks the browser reads on demand.
name: Deploy Reader to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Fetch the archive and split it for on-demand reading
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download archive-data -p archive.db.gz -O - | gunzip > "$RUNNER_TEMP/archive.db"
          mkdir -p reader/data/archive
          split -b 10485760 -d -a 3 "$RUNNER_TEMP/archive.db" reader/data/archive/db.
          python3 - <<'PY'
          import json, os
          size = os.path.getsize(os.environ["RUNNER_TEMP"] + "/archive.db")
          json.dump({"serverMode": "chunked", "requestChunkSize": 4096, "databaseLengthBytes": size,
                     "serverChunkSize": 10485760, "urlPrefix": "db.", "suffixLength": 3},
                    open("reader/data/archive/config.json", "w"))
          PY
          ls reader/data/archive | wc -l
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader
      - id: deployment
        uses: actions/deploy-pages@v4
