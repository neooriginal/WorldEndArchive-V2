# Builds the offline Android app (with reader/data/archive.db baked in) on every push and publishes the APK as a release.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the Android SDK is preinstalled on GitHub's ubuntu runners (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (optional - see README)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release key secret - signing with the shared debug key in android/app/debug.keystore."
          fi

      - name: Build release APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/WorldEndArchive.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: WorldEndArchive 2.0.${{ github.run_number }}
          make_latest: true
          body: |
            Offline Android app with the full archive built in - no internet needed after install.

            **Install:** download `WorldEndArchive.apk` below on your phone and open it (allow "install unknown apps" when asked).

            Built from ${{ github.sha }}.
          files: ${{ runner.temp }}/WorldEndArchive.apk
